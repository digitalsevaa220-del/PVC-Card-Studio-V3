name: Build PVC Card Studio V3 Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "PVC Card Studio V3" main.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PVC-Card-Studio-V3-Setup-Windows-x64
          path: Output\PVC_Card_Studio_V3_Setup.exe
          if-no-files-found: error
